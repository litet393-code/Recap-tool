
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>Auto Movie Recap</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#101827;color:white;font-family:Arial,sans-serif}
.container{max-width:650px;margin:auto}
h1{text-align:center;color:#55d6be}
.sub{text-align:center;color:#aab6c8}
.panel{background:#1d293b;padding:18px;border-radius:15px;margin:18px 0}
label{display:block;margin:12px 0;font-weight:bold}
input,textarea{width:100%;padding:13px;border-radius:9px;border:1px solid #40516b;background:#111c2d;color:white}
textarea{min-height:180px}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#12b99b;color:#071b20;font-size:16px;font-weight:bold;margin-top:12px}
.secondary{background:#34445e;color:white}
button:disabled{opacity:.5}
video{width:100%;margin-top:12px;border-radius:10px;background:black}
.note{font-size:13px;color:#aab6c8;line-height:1.6}
#status{text-align:center;color:#55d6be}
</style>
</head>
<body>
<div class="container">
<h1>🎬 Auto Movie Recap</h1>
<p class="sub">မြန်မာ Movie Recap Studio</p>

<div class="panel">
<h3>၁။ Movie Upload</h3>
<label>ရုပ်ရှင်ဖိုင် ရွေးပါ</label>
<input type="file" id="movie" accept="video/*">
<video id="preview" controls hidden></video>
<p class="note">ဖုန်းထဲမှ Video ဖိုင်ရွေးပါ။</p>
</div>

<div class="panel">
<h3>၂။ AI Movie Recap</h3>
<button id="aiButton">🤖 AI နဲ့ Recap ထုတ်မယ်</button>
<p id="status">Movie ဖိုင်ရွေးပါ။</p>
</div>

<div class="panel">
<h3>၃။ Recap Script</h3>
<textarea id="script" placeholder="Recap စာသား ဒီနေရာမှာ ပေါ်လာပါမယ်..."></textarea>
</div>

<div class="panel">
<h3>၄။ မြန်မာအသံ</h3>
<button id="speakButton">🔊 အသံထွက်ဖတ်မယ်</button>
<button class="secondary" id="pauseButton">ခဏရပ်မယ်</button>
<button class="secondary" id="stopButton">အသံရပ်မယ်</button>
</div>
<p class="note" style="text-align:center">Auto Movie Recap · Android Web App</p>
</div>

<script>
const movie=document.getElementById('movie');
const preview=document.getElementById('preview');
const script=document.getElementById('script');
const aiButton=document.getElementById('aiButton');
const statusText=document.getElementById('status');

movie.addEventListener('change',function(){
  if(this.files&&this.files[0]){
    preview.src=URL.createObjectURL(this.files[0]);
    preview.hidden=false;
    statusText.textContent='Movie ဖိုင် ရွေးပြီးပါပြီ။';
  }
});

aiButton.addEventListener('click',async function(){
  if(!movie.files||!movie.files[0]){
    alert('အရင်ဆုံး Movie ဖိုင်ရွေးပါ။');
    return;
  }

  if(!preview.videoWidth){
    alert('Video ကို အရင်ဖွင့်ပြီး ခဏစောင့်ပါ။');
    return;
  }

  aiButton.disabled=true;
  aiButton.textContent='AI လုပ်ဆောင်နေသည်...';
  statusText.textContent='AI စစ်ဆေးနေပါတယ်။';

  try{
    preview.pause();

    const canvas=document.createElement('canvas');
    canvas.width=preview.videoWidth;
    canvas.height=preview.videoHeight;
    canvas.getContext('2d').drawImage(preview,0,0);

    const image=canvas.toDataURL('image/jpeg',0.7);

    const response=await fetch('/api/recap',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image:image})
    });

    const data=await response.json();

    if(!response.ok){
      throw new Error(data.error||'AI Error');
    }

    script.value=data.recap||'Recap စာသား မရရှိပါ။';
    statusText.textContent='AI Recap ရရှိပါပြီ။';
    alert('AI Recap ထွက်လာပါပြီ။');

  }catch(error){
    statusText.textContent='AI လုပ်ဆောင်မှု မအောင်မြင်ပါ။';
    alert('အမှားရှိနေပါတယ်: '+error.message);
  }finally{
    aiButton.disabled=false;
    aiButton.textContent='🤖 AI နဲ့ Recap ထုတ်မယ်';
  }
});

document.getElementById('speakButton').onclick=function(){
  const text=script.value.trim();
  if(!text){
    alert('Recap စာသား အရင်ထည့်ပါ။');
    return;
  }
  if(!('speechSynthesis' in window)){
    alert('ဒီ Browser မှာ အသံဖတ်စနစ် မရနိုင်ပါ။');
    return;
  }
  speechSynthesis.cancel();
  const msg=new SpeechSynthesisUtterance(text);
  msg.lang='my-MM';
  msg.rate=0.9;
  msg.pitch=0.9;
  speechSynthesis.speak(msg);
};

document.getElementById('pauseButton').onclick=function(){
  if('speechSynthesis' in window)speechSynthesis.pause();
};

document.getElementById('stopButton').onclick=function(){
  if('speechSynthesis' in window)speechSynthesis.cancel();
};
</script>
</body>
</html>
